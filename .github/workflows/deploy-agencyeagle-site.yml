name: Deploy agencyeagle.com

# Publishes agencyeagle-site/public_html to the server's public_html over FTPS.
# - Every push to master that touches agencyeagle-site/ syncs changed files.
# - Run it by hand (Actions > Deploy agencyeagle.com > Run workflow) with "wipe"
#   checked to delete EVERYTHING in public_html first. Use that once, for the
#   switch away from WordPress.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER        e.g. host.agencyeagle.com
#   No FTP password is stored: each run uses the WHM token to give the FTP account
#   deploy@agencyeagle.com (home: lagunait's public_html) a fresh random password,
#   creating the account the first time.
#   GOOGLE_CLIENT_ID      OAuth client (Web application) from Google Cloud Console
#   GOOGLE_CLIENT_SECRET  its secret
#   ADMIN_EMAILS          Google account(s) allowed into /admin, comma separated
#   WHM_USER              WHM login that owns the API token (root or a reseller)
#   WHM_API_TOKEN         WHM API token for that login (also used to set the deploy FTP password)
#   WHM_HOST              optional; defaults to host.agencyeagle.com

on:
  push:
    branches: [master]
    paths: ['agencyeagle-site/**', '.github/workflows/deploy-agencyeagle-site.yml']
  workflow_dispatch:
    inputs:
      wipe:
        description: 'Delete everything in public_html before uploading'
        type: boolean
        default: false

concurrency:
  group: deploy-agencyeagle-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check site against standards
        run: python3 agencyeagle-site/public_html/_private/tools/check_site.py agencyeagle-site/public_html

      - name: Bundle the standards for Site Briefs
        run: cp agencyeagle-site/STANDARDS.md agencyeagle-site/public_html/_private/STANDARDS.md

      - name: Write Google sign-in config
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          python3 - <<'PY'
          import json, os
          conf = {
              "client_id": os.environ["GOOGLE_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
              "allowed_emails": [e.strip() for e in os.environ["ADMIN_EMAILS"].split(",") if e.strip()],
          }
          if all(conf.values()):
              with open("agencyeagle-site/public_html/_private/data/oauth.conf", "w") as f:
                  json.dump(conf, f)
          else:
              print("Google sign-in secrets not set; /admin will show setup instructions.")
          PY

      - name: Write WHM config
        env:
          WHM_HOST: ${{ secrets.WHM_HOST }}
          WHM_USER: ${{ secrets.WHM_USER }}
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os
          if os.environ["WHM_USER"] and os.environ["WHM_API_TOKEN"]:
              with open("agencyeagle-site/public_html/_private/data/whm.conf", "w") as f:
                  json.dump({"host": os.environ["WHM_HOST"] or "host.agencyeagle.com",
                             "user": os.environ["WHM_USER"], "token": os.environ["WHM_API_TOKEN"]}, f)
          else:
              print("WHM secrets not set; /admin/sites.php will show setup instructions.")
          PY

      # Site watch on agencyeagle.com itself: list what this deploy ships (path and size), so the
      # admin's own code updates aren't reported as changed files.
      - name: Write deploy manifest
        run: |
          python3 - <<'PY'
          import json, os
          root = "agencyeagle-site/public_html"
          out = {}
          for d, _, files in os.walk(root):
              for f in files:
                  p = os.path.join(d, f)
                  out[os.path.relpath(p, root)] = os.path.getsize(p)
          with open(os.path.join(root, "_private/deploy-manifest.json"), "w") as fh:
              json.dump(out, fh)
          print(f"{len(out)} files in the manifest")
          PY

      - name: Set a fresh password on the deploy FTP login
        id: ftp
        env:
          WHM_HOST: ${{ secrets.WHM_HOST }}
          WHM_USER: ${{ secrets.WHM_USER }}
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          CPANEL_USER: lagunait
          FTP_LOGIN: deploy
          FTP_DOMAIN: agencyeagle.com
        run: |
          python3 - <<'PY'
          import json, os, secrets, string, urllib.parse, urllib.request
          pw = "Ae7!" + "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(28))
          print(f"::add-mask::{pw}")
          host = os.environ["WHM_HOST"] or "host.agencyeagle.com"
          def uapi(func, **args):
              body = urllib.parse.urlencode({"cpanel_jsonapi_user": os.environ["CPANEL_USER"], "cpanel_jsonapi_apiversion": 3,
                                             "cpanel_jsonapi_module": "Ftp", "cpanel_jsonapi_func": func, **args}).encode()
              req = urllib.request.Request(f"https://{host}:2087/json-api/cpanel?api.version=1", data=body,
                                           headers={"Authorization": f"whm {os.environ['WHM_USER']}:{os.environ['WHM_API_TOKEN']}"})
              res = json.load(urllib.request.urlopen(req, timeout=60))
              # The WHM "cpanel" bridge answers with the UAPI result itself: {"result": {"status": 1, "errors": ...}}.
              inner = res.get("result") or {}
              return inner.get("status") == 1, inner.get("errors") or res.get("metadata", {}).get("reason")
          login, domain = os.environ["FTP_LOGIN"], os.environ["FTP_DOMAIN"]
          ok, why = uapi("passwd", user=login, domain=domain, **{"pass": pw})
          if not ok:
              print(f"Changing the password didn't work ({why}); creating the FTP login instead.", flush=True)
              ok, why = uapi("add_ftp", user=login, domain=domain, homedir="public_html", quota=0, **{"pass": pw})
          if not ok:
              raise SystemExit(f"Couldn't prepare the deploy FTP login: {why}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"username={login}@{domain}\npassword={pw}\n")
          print(f"FTP login {login}@{domain} is ready.")
          PY

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ steps.ftp.outputs.username }}
          password: ${{ steps.ftp.outputs.password }}
          protocol: ftps
          local-dir: agencyeagle-site/public_html/
          server-dir: ./
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.wipe }}
          exclude: |
            **/.git*
            **/.git*/**
            _private/data/*.json
            _private/data/quiz/**
            _private/data/crm/**
            _private/data/breakglass.token
            _private/data/whm-audit.jsonl
            _private/data/brain/**
            _private/data/backups/**
            _private/data/watch/**
            _private/data/golive/**
            _private/data/forms/**
            _private/data/nightly.lock
            _private/data/*.log

      # Tell Bing (and the other IndexNow engines) the pages changed, instead of waiting for a crawl.
      # The key is public by design: it is served at /<key>.txt.
      - name: Ping IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          KEY=b115cbcc61b8cd132c1ba96bcafa8eb8
          URLS=$(grep -o '<loc>[^<]*' agencyeagle-site/public_html/sitemap.xml | sed 's/<loc>//' | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"agencyeagle.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://agencyeagle.com/$KEY.txt\",\"urlList\":$URLS}"
