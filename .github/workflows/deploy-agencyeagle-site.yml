name: Deploy agencyeagle.com

# Publishes agencyeagle-site/public_html to the server's public_html over FTPS.
# - Every push to master that touches agencyeagle-site/ syncs changed files.
# - Run it by hand (Actions > Deploy agencyeagle.com > Run workflow) with "wipe"
#   checked to delete EVERYTHING in public_html first. Use that once, for the
#   switch away from WordPress.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER        e.g. host.agencyeagle.com
#   FTP_USERNAME      FTP account whose home is public_html
#   FTP_PASSWORD
#   FTP_DIR           optional; "public_html/" if the FTP login opens in the account home
#   GOOGLE_CLIENT_ID      OAuth client (Web application) from Google Cloud Console
#   GOOGLE_CLIENT_SECRET  its secret
#   ADMIN_EMAILS          Google account(s) allowed into /admin, comma separated

on:
  push:
    branches: [master]
    paths: ['agencyeagle-site/**', '.github/workflows/deploy-agencyeagle-site.yml']
  workflow_dispatch:
    inputs:
      wipe:
        description: 'Delete everything in public_html before uploading'
        type: boolean
        default: false

concurrency:
  group: deploy-agencyeagle-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check site against standards
        run: python3 agencyeagle-site/public_html/_private/tools/check_site.py agencyeagle-site/public_html

      - name: Write Google sign-in config
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          python3 - <<'PY'
          import json, os
          conf = {
              "client_id": os.environ["GOOGLE_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
              "allowed_emails": [e.strip() for e in os.environ["ADMIN_EMAILS"].split(",") if e.strip()],
          }
          if all(conf.values()):
              with open("agencyeagle-site/public_html/_private/data/oauth.conf", "w") as f:
                  json.dump(conf, f)
          else:
              print("Google sign-in secrets not set; /admin will show setup instructions.")
          PY

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: agencyeagle-site/public_html/
          server-dir: ${{ secrets.FTP_DIR || './' }}
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.wipe }}
          exclude: |
            **/.git*
            **/.git*/**
            _private/data/*.json
            _private/data/quiz/**
            _private/data/breakglass.token

      # Tell Bing (and the other IndexNow engines) the pages changed, instead of waiting for a crawl.
      # The key is public by design: it is served at /<key>.txt.
      - name: Ping IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          KEY=b115cbcc61b8cd132c1ba96bcafa8eb8
          URLS=$(grep -o '<loc>[^<]*' agencyeagle-site/public_html/sitemap.xml | sed 's/<loc>//' | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"agencyeagle.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://agencyeagle.com/$KEY.txt\",\"urlList\":$URLS}"
